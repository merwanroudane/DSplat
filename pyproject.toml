[project]
name = "data-science-interactive-academy"
version = "1.0.0"
description = "An interactive Arabic Data Science course built with Streamlit (أكاديمية علم البيانات التفاعلية)."
readme = "README.md"
authors = [{ name = "Dr. Marwan Roudane" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "streamlit>=1.63,<2",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<0.16",
    "plotly>=5.24,<7",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
validation = ["pandera>=0.24"]
profiling = ["fg-data-profiling"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B006", "B008"]
